name: Tests on cclib master

# Early warning for upstream cclib changes (e.g. a release that fixes or
# breaks ORCA 6 or Q-Chem parsing). Not run on pull requests, so an
# unrelated cclib regression never blocks a PR.
on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pyQRC with cclib from GitHub master
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install --upgrade "git+https://github.com/cclib/cclib.git"
          python -c "import cclib; print('cclib', cclib.__version__)"
      - name: Run tests
        run: pytest -v
