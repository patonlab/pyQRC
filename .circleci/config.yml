version: 2.1

jobs:
  test:
    parameters:
      python-version:
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            pip install --upgrade pip
            pip install -e ".[dev]"
      - run:
          name: Run tests with coverage
          command: |
            # CPython 3.12's settrace is pathologically slow under coverage
            # (gh-107674); the sys.monitoring core avoids it but only exists
            # on 3.12+.
            if python -c 'import sys; sys.exit(sys.version_info < (3, 12))'; then
              export COVERAGE_CORE=sysmon
            fi
            pytest --cov=pyqrc --cov-report=xml -v
      - run:
          name: Upload coverage to Codecov (non-blocking)
          command: |
            pip install codecov-cli
            codecovcli upload-process --file coverage.xml || echo "Codecov upload failed; not failing the build"

  package:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Build wheel
          command: |
            pip install --upgrade pip build
            python -m build --wheel --outdir dist/
      - run:
          name: Verify wheel contents
          command: |
            unzip -l dist/*.whl
            unzip -l dist/*.whl | grep "pyqrc/run_g16.sh"
      - run:
          name: Install wheel in clean venv and smoke-test CLI
          command: |
            python -m venv /tmp/venv
            /tmp/venv/bin/pip install dist/*.whl
            mkdir /tmp/smoke && cd /tmp/smoke
            cp ~/project/examples/g16/acetaldehyde.log .
            /tmp/venv/bin/pyqrc acetaldehyde.log
            test -f acetaldehyde_QRC.com

workflows:
  test:
    jobs:
      - test:
          matrix:
            parameters:
              python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
      - package
